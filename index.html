<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Калькулятор Спільного Чеку</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
            display: flex;
            justify-content: center;
            background-size: cover;
        }
        .container {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }
        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #2980b9; }
        .btn-add { background-color: #2ecc71; margin-bottom: 20px; }
        .btn-add:hover { background-color: #27ae60; }
        .btn-calc { width: 100%; background-color: #e67e22; font-size: 18px; padding: 12px; }
        .btn-calc:hover { background-color: #d35400; }
        .btn-remove { background-color: #e74c3c; padding: 5px 10px; }
        .btn-remove:hover { background-color: #c0392b; }
        
        .person-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 10px;
            align-items: center;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 4px solid #3498db;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
        }
        .checkbox-group input { cursor: pointer; transform: scale(1.2); }
        
        #results {
            margin-top: 25px;
            padding: 15px;
            background: #edf2f7;
            border-radius: 6px;
            display: none;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #cbd5e0;
        }
        .result-item:last-child { border: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🍻 Калькулятор Чеку 🍕</h1>
    
    <!-- Загальні суми -->
    <div class="form-group">
        <label for="totalBeer">Загальна сума за ПИВО (₴):</label>
        <input type="number" id="totalBeer" value="0" min="0">
    </div>
    <div class="form-group">
        <label for="totalFood">Загальна сума за ЇЖУ (₴):</label>
        <input type="number" id="totalFood" value="0" min="0">
    </div>

    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

    <!-- Список людей -->
    <h3>Люди:</h3>
    <button type="button" class="btn btn-add" id="addPersonBtn">+ Додати людину</button>
    
    <div id="peopleList">
        <!-- Перша людина за замовчуванням -->
        <div class="person-row">
            <input type="text" placeholder="Ім'я" class="person-name" value="Гість 1">
            <div class="checkbox-group">
                <input type="checkbox" class="chk-beer" checked> <label style="margin:0;">Пиво</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" class="chk-food" checked> <label style="margin:0;">Їжа</label>
            </div>
            <button class="btn btn-remove" onclick="this.parentElement.remove()">X</button>
        </div>
    </div>

    <button type="button" class="btn btn-calc" id="calcBtn">Розрахувати</button>

    <!-- Результати -->
    <div id="results">
        <h3>Хто скільки винен:</h3>
        <div id="resultsList"></div>
    </div>
</div>

<script>
    // --- Скрипт для слайд-шоу фону ---
    const images = [
        "https://smska.biz.ua/wp-content/uploads/2025/07/beer1.jpg",
        "https://smska.biz.ua/wp-content/uploads/2025/07/beer2.jpg",
        "https://smska.biz.ua/wp-content/uploads/2025/07/beer3.jpg",
        "https://smska.biz.ua/wp-content/uploads/2025/07/beer4.jpg",
        "https://smska.biz.ua/wp-content/uploads/2025/07/beer5.jpg",
        "https://smska.biz.ua/wp-content/uploads/2025/07/beer6.jpg",
        "https://smska.biz.ua/wp-content/uploads/2025/07/beer7.jpg",
        "https://smska.biz.ua/wp-content/uploads/2025/07/beer8.jpg"
    ];

    let currentImgIndex = 0;

    function changeBackground() {
        // Задаємо нове фонове зображення
        document.body.style.backgroundImage = `url('${images[currentImgIndex]}')`;
        // Змінюємо індекс для наступного разу
        currentImgIndex = (currentImgIndex + 1) % images.length;
    }

    // Запускаємо першу картинку відразу
    changeBackground();
    // Зміна картинки кожні 5 секунд (5000 мілісекунд)
    setInterval(changeBackground, 5000);
    // ----------------------------------
    
    // Функція для додавання нового рядка людини
    document.getElementById('addPersonBtn').addEventListener('click', function() {
        const container = document.getElementById('peopleList');
        const count = container.children.length + 1;
        
        const row = document.createElement('div');
        row.className = 'person-row';
        row.innerHTML = `
            <input type="text" placeholder="Ім'я" class="person-name" value="Гість ${count}">
            <div class="checkbox-group">
                <input type="checkbox" class="chk-beer" checked> <label style="margin:0;">Пиво</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" class="chk-food" checked> <label style="margin:0;">Їжа</label>
            </div>
            <button class="btn btn-remove" onclick="this.parentElement.remove()">X</button>
        `;
        container.appendChild(row);
    });

    // Змінна для збереження тексту результату
    let textToShare = "";

    // Логіка розрахунку
    document.getElementById('calcBtn').addEventListener('click', function() {
        const totalBeer = parseFloat(document.getElementById('totalBeer').value) || 0;
        const totalFood = parseFloat(document.getElementById('totalFood').value) || 0;
        
        const rows = document.querySelectorAll('.person-row');
        
        let beerDrinkersCount = 0;
        let foodEatersCount = 0;
        const people = [];

        rows.forEach(row => {
            const name = row.querySelector('.person-name').value.trim() || "Анонім";
            const wantsBeer = row.querySelector('.chk-beer').checked;
            const wantsFood = row.querySelector('.chk-food').checked;
            
            if (wantsBeer) beerDrinkersCount++;
            if (wantsFood) foodEatersCount++;
            
            people.push({ name, wantsBeer, wantsFood, total: 0 });
        });

        const beerShare = beerDrinkersCount > 0 ? (totalBeer / beerDrinkersCount) : 0;
        const foodShare = foodEatersCount > 0 ? (totalFood / foodEatersCount) : 0;

        people.forEach(person => {
            if (person.wantsBeer) person.total += beerShare;
            if (person.wantsFood) person.total += foodShare;
        });

        const resultsList = document.getElementById('resultsList');
        resultsList.innerHTML = '';
        
        if (people.length === 0) {
            resultsList.innerHTML = '<div>Нікого не додано для розрахунку.</div>';
            return;
        }

        // Формуємо гарний текстовий рядок для месенджерів
        textToShare = "📊 **Розрахунок чеку:**\n";
        
        people.forEach(person => {
            const roundedTotal = person.total.toFixed(2);
            textToShare += `• ${person.name}: ${roundedTotal} ₴\n`;

            const item = document.createElement('div');
            item.className = 'result-item';
            item.innerHTML = `<strong>${person.name}</strong> <span>${roundedTotal} ₴</span>`;
            resultsList.appendChild(item);
        });
        
        textToShare += `\n💰 Разом: ${(totalBeer + totalFood).toFixed(2)} ₴`;

        // Додаємо кнопки "Поділитися" та "Копіювати", якщо їх ще немає
        if (!document.getElementById('shareBlock')) {
            const shareBlock = document.createElement('div');
            shareBlock.id = 'shareBlock';
            shareBlock.style.marginTop = '20px';
            shareBlock.style.display = 'flex';
            shareBlock.style.gap = '10px';
            
            shareBlock.innerHTML = `
                <button type="button" class="btn" id="shareBtn" style="background-color: #9b59b6; flex: 1;">📱 Надіслати</button>
                <button type="button" class="btn" id="copyBtn" style="background-color: #7f8c8d; flex: 1;">📋 Копіювати</button>
            `;
            document.getElementById('results').appendChild(shareBlock);

            // Обробник для кнопки "Поділитися" (працює на смартфонах)
            document.getElementById('shareBtn').addEventListener('click', async () => {
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: 'Рахунок чеку',
                            text: textToShare
                        });
                    } catch (err) {
                        console.log("Шеринг скасовано або стався збій: ", err);
                    }
                } else {
                    alert("Ваш браузер не підтримує прямий шеринг. Скористайтеся сусідньою кнопкою 'Копіювати текст'!");
                }
            });

            // Обробник для кнопки "Копіювати" (універсальний варіант)
            document.getElementById('copyBtn').addEventListener('click', () => {
                // Очищаємо markdown зірочки для чистого тексту в буфері
                const plainText = textToShare.replace(/\*\*/g, ''); 
                navigator.clipboard.writeText(plainText).then(() => {
                    const originalText = document.getElementById('copyBtn').innerText;
                    document.getElementById('copyBtn').innerText = "✅ Скопійовано!";
                    setTimeout(() => {
                        document.getElementById('copyBtn').innerText = originalText;
                    }, 2000);
                }).catch(err => {
                    alert("Не вдалося скопіювати: " + err);
                });
            });
        }

        document.getElementById('results').style.display = 'block';
    });
</script>

</body>
</html>
